<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhrikhit</title>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Dancing+Script:wght@600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03060f;color:#fff;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- DOB GATE ---------- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
        background:radial-gradient(ellipse at 50% 40%,#0b1730 0%,#03060f 70%);transition:opacity .9s ease,visibility .9s}
  #gate.hide{opacity:0;visibility:hidden;pointer-events:none}
  .card{width:min(92vw,380px);padding:34px 28px;border-radius:20px;text-align:center;
        background:rgba(255,255,255,.05);border:1px solid rgba(120,200,255,.25);
        box-shadow:0 0 40px rgba(60,160,255,.15);backdrop-filter:blur(8px)}
  .card h1{font-family:Orbitron,system-ui,sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:8px;color:#9fe3ff}
  .card p{font-size:13px;opacity:.7;margin-bottom:22px}
  .card input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);
        background:rgba(0,0,0,.4);color:#fff;font-size:17px;text-align:center;outline:none;color-scheme:dark}
  .card input:focus{border-color:#58c8ff;box-shadow:0 0 0 3px rgba(88,200,255,.2)}
  .card button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;
        letter-spacing:1px;cursor:pointer;color:#03101e;background:linear-gradient(90deg,#58c8ff,#7cffc4)}
  .card button:disabled{opacity:.5;cursor:not-allowed}
  #msg{min-height:20px;margin-top:14px;font-size:13px;color:#ff7b7b}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

  /* ---------- NAME + SIGNATURE ---------- */
  #info{position:fixed;left:0;right:0;bottom:2.5vh;z-index:5;text-align:center;pointer-events:none;padding:0 12px}
  #name{font-family:Orbitron,system-ui,sans-serif;font-size:clamp(26px,6.5vw,52px);letter-spacing:.18em;font-weight:600;
        background:linear-gradient(90deg,#58c8ff,#b6ffe1,#58c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
        text-shadow:none;opacity:0;transform:translateY(14px);transition:opacity 1.6s ease,transform 1.6s ease}
  #name.show{opacity:1;transform:none}
  #sigwrap{margin-top:6px;opacity:0;transition:opacity 1s ease}
  #sigwrap.show{opacity:1}
  #from{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.55}
  #sig{display:inline-block;font-family:'Mrs Saint Delafield','Dancing Script',cursive;font-size:clamp(38px,9vw,70px);line-height:1.1;
       color:#f3f7ff;text-shadow:0 0 14px rgba(120,200,255,.45);
       clip-path:inset(0 100% 0 0);transform:rotate(-3deg)}
  #sigwrap.show #sig{animation:write 3.2s cubic-bezier(.5,.1,.3,1) forwards}
  @keyframes write{to{clip-path:inset(0 0 0 0)}}
  svg#swoosh{display:block;margin:-4px auto 0;width:min(60vw,300px);height:16px}
  svg#swoosh path{fill:none;stroke:#9fe3ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400}
  #sigwrap.show svg#swoosh path{animation:draw 1.6s ease 2.6s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="gate">
  <form class="card" id="card" autocomplete="off">
    <h1>IDENTITY CHECK</h1>
    <p>Enter your Date of Birth to continue</p>
    <input type="date" id="dob" required>
    <button type="submit" id="go">UNLOCK</button>
    <div id="msg"></div>
  </form>
</div>

<div id="info">
  <div id="name">DHRIKHIT</div>
  <div id="sigwrap">
    <div id="from">Your Robotics Sir</div>
    <div id="sig">Bishal Bezbaruah</div>
    <svg id="swoosh" viewBox="0 0 300 16"><path d="M8 11 C60 2, 120 14, 180 6 S270 4, 292 9"/></svg>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG  -  THE CORRECT DOB IS STORED HERE.  FORMAT: YYYY-MM-DD
   ===================================================================== */
const CONFIG = {
  CORRECT_DOB : "2013-01-01",   // <<< CHANGE THIS TO THE STUDENT'S REAL DOB
  MAX_TRIES   : 5,              // wrong attempts before temporary lock
  LOCK_SECONDS: 60
};

/* ---------------- DOB CHECK ---------------- */
const gate = document.getElementById('gate'), card = document.getElementById('card'),
      dobEl = document.getElementById('dob'), msg = document.getElementById('msg'),
      goBtn = document.getElementById('go');
let tries = 0, lockedUntil = 0;

card.addEventListener('submit', e => {
  e.preventDefault();
  const now = Date.now();
  if (now < lockedUntil) { msg.textContent = 'Locked. Wait ' + Math.ceil((lockedUntil-now)/1000) + 's'; return; }
  if (dobEl.value === CONFIG.CORRECT_DOB) {
    msg.style.color = '#7cffc4'; msg.textContent = 'Access granted';
    setTimeout(() => { gate.classList.add('hide'); startShow(); }, 500);
  } else {
    tries++;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    msg.style.color = '#ff7b7b';
    if (tries >= CONFIG.MAX_TRIES) {
      lockedUntil = Date.now() + CONFIG.LOCK_SECONDS*1000; tries = 0;
      goBtn.disabled = true; msg.textContent = 'Too many tries. Locked for ' + CONFIG.LOCK_SECONDS + 's';
      setTimeout(() => { goBtn.disabled = false; msg.textContent = ''; }, CONFIG.LOCK_SECONDS*1000);
    } else msg.textContent = 'Wrong date of birth. Try again (' + (CONFIG.MAX_TRIES-tries) + ' left)';
  }
});

const STEP = 4, GW = 204, GH = 230, SW = GW*STEP, SH = 917;

const bin = atob(FACE), N = (bin.length/5)|0;
const FX = new Float32Array(N), FY = new Float32Array(N), COL = new Uint32Array(N),
      CR = new Uint8Array(N), CG = new Uint8Array(N), CB = new Uint8Array(N),
      DEL = new Float32Array(N), CA = new Float32Array(N), SA = new Float32Array(N),
      RF = new Float32Array(N), KK = new Float32Array(N), PH = new Float32Array(N),
      OX = new Float32Array(N), OY = new Float32Array(N), VX = new Float32Array(N), VY = new Float32Array(N);
for (let i=0;i<N;i++){
  const o = i*5, r = bin.charCodeAt(o+2), g = bin.charCodeAt(o+3), b = bin.charCodeAt(o+4);
  FX[i] = bin.charCodeAt(o)*STEP + STEP/2 + (Math.random()-.5)*.8;
  FY[i] = bin.charCodeAt(o+1)*STEP + STEP/2 + (Math.random()-.5)*.8;
  CR[i] = r; CG[i] = g; CB[i] = b;
  COL[i] = ((255<<24) | (b<<16) | (g<<8) | r) >>> 0;
  DEL[i] = Math.random()*1800;
  const a = Math.random()*Math.PI*2; CA[i] = Math.cos(a); SA[i] = Math.sin(a);
  RF[i] = .7 + Math.random()*.6; KK[i] = (Math.random()-.5)*1.2; PH[i] = Math.random()*6.28;
}

/* ---------------- CANVAS + LAYOUT ---------------- */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W, H, DPR, cw, ch, imgData, buf, scale, offX, offY, ps;
const BG = ((255<<24) | (15<<16) | (6<<8) | 3) >>> 0;

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cw = Math.round(W*DPR); ch = Math.round(H*DPR);
  cv.width = cw; cv.height = ch;
  imgData = ctx.createImageData(cw, ch);
  buf = new Uint32Array(imgData.data.buffer);
  scale = Math.min((H*0.60)/SH, (W*0.94)/SW);
  offX = (W - SW*scale)/2; offY = H*0.025;
  ps = Math.max(2, Math.round(STEP*scale*DPR));
}
addEventListener('resize', layout);
layout();

/* ---------------- BACKGROUND STARS ---------------- */
const stars = Array.from({length:110}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.4+.3, s:Math.random()*.0004+.0001, ph:Math.random()*6}));

/* ---------------- MOUSE / TOUCH ---------------- */
let mx = -9999, my = -9999;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; });
addEventListener('pointerup', () => { mx = my = -9999; });
document.addEventListener('mouseleave', () => { mx = my = -9999; });

/* ---------------- ANIMATION ---------------- */
let running = false, t0 = 0;
const DUR = 2800;
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function startShow(){
  running = true; t0 = performance.now();
  setTimeout(() => document.getElementById('name').classList.add('show'), 3800);
  setTimeout(() => document.getElementById('sigwrap').classList.add('show'), 5000);
}

function frame(now){
  buf.fill(BG);

  // stars
  for (const s of stars){
    const a = .25 + .5*Math.abs(Math.sin(now*s.s*6 + s.ph)), v = (a*255)|0;
    const col = ((255<<24) | (v<<16) | (((v*.92)|0)<<8) | ((v*.75)|0)) >>> 0;
    const X = (s.x*cw)|0, Y = (((s.y*H + now*s.s*40) % H)*DPR)|0;
    buf[Y*cw+X] = col;
    if (s.r > 1){ buf[Y*cw+X+1] = col; buf[(Y+1)*cw+X] = col; }
  }

  if (running){
    const el = now - t0, R = 62, R2 = R*R, maxD = Math.max(W,H), cx0 = W/2, cy0 = H/2;
    for (let i=0;i<N;i++){
      const t = Math.min(1, Math.max(0, (el - DEL[i])/DUR)), e = ease(t), u = 1-e;
      const tx = offX + FX[i]*scale, ty = offY + FY[i]*scale;
      const sx = cx0 + CA[i]*RF[i]*maxD, sy = cy0 + SA[i]*RF[i]*maxD;
      const k = KK[i], px = (sx+tx)/2 + (ty-sy)*k, py = (sy+ty)/2 + (sx-tx)*k;
      let x = u*u*sx + 2*u*e*px + e*e*tx, y = u*u*sy + 2*u*e*py + e*e*ty;

      if (t >= 1){ x += Math.sin(now*.002 + PH[i])*.6; y += Math.cos(now*.0017 + PH[i])*.6; }

      const dx = x + OX[i] - mx, dy = y + OY[i] - my, d2 = dx*dx + dy*dy;
      if (d2 < R2 && d2 > .01){
        const d = Math.sqrt(d2), f = (1 - d/R)*5;
        VX[i] += dx/d*f; VY[i] += dy/d*f;
      }
      VX[i] += -OX[i]*.06; VY[i] += -OY[i]*.06; VX[i] *= .84; VY[i] *= .84;
      OX[i] += VX[i]; OY[i] += VY[i];

      const X = ((x + OX[i])*DPR)|0, Y = ((y + OY[i])*DPR)|0;
      if (X < -ps || Y < -ps || X >= cw || Y >= ch) continue;

      let c = COL[i];
      const a = Math.min(1, t*3 + .15);
      if (a < .999) c = ((255<<24) | (((CB[i]*a)|0)<<16) | (((CG[i]*a)|0)<<8) | ((CR[i]*a)|0)) >>> 0;

      const x0 = X < 0 ? 0 : X, x1 = X+ps > cw ? cw : X+ps, y0 = Y < 0 ? 0 : Y, y1 = Y+ps > ch ? ch : Y+ps;
      for (let yy=y0; yy<y1; yy++){
        const row = yy*cw;
        for (let xx=x0; xx<x1; xx++) buf[row+xx] = c;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
